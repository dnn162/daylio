<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daylio</title>
<meta name="theme-color" content="#E2A93B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daylio">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ===== Daylio · 黄色温馨 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --paper: #FDFAF1;
  --paper-2: #FBF3DF;
  --card: #FFFFFF;
  --ink: #3F3728;
  --ink-2: #6B5D45;
  --muted: #A0906F;
  --line: #F0E4C8;
  --line-2: #F8EFD9;
  --honey: #E2A93B;
  --honey-deep: #C08823;
  --honey-soft: #FDF0D2;
  --amber: #D9822B;
  --olive: #9A9C5E;
  --glow-1: #FDF2D8;
  --glow-2: #FBF6E6;
  --hero-1: #FFFDF6;
  --hero-2: #FDF1D3;
  --hero-3: #FBF6E7;
  --shadow: 0 1px 2px rgba(150, 120, 60, .05), 0 10px 26px rgba(150, 120, 60, .08);
  --r: 18px;
  --serif: "Songti SC", "SimSun", "Source Han Serif SC", Georgia, serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
}

body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(820px 520px at 100% 0%, var(--glow-1) 0%, transparent 55%),
    radial-gradient(700px 520px at 0% 100%, var(--glow-2) 0%, transparent 55%),
    var(--paper);
  min-height: 100vh; font-size: 14px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 224px; flex: 0 0 224px; background: rgba(255,255,255,.74);
  border-right: 1px solid var(--line); padding: 22px 16px 16px;
  display: flex; flex-direction: column; gap: 16px;
  position: sticky; top: 0; height: 100vh; backdrop-filter: blur(6px);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 38px; height: 38px; }
.brand-name { font-family: var(--serif); font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.brand-sub { font-size: 10.5px; color: var(--muted); letter-spacing: .16em; }

.streak { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-align: center; box-shadow: var(--shadow); }
.streak .k { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.streak .v { font-family: var(--serif); font-size: 30px; font-weight: 700; color: var(--honey-deep); line-height: 1.25; }
.streak .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
.streak .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: none; background: none;
  border-radius: 11px; cursor: pointer; font-family: inherit; font-size: 13.5px; color: var(--ink-2);
  text-align: left; width: 100%; transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--paper-2); }
.nav-item.active { background: var(--honey-soft); color: var(--honey-deep); font-weight: 600; }
.nav-item .ico { width: 17px; text-align: center; }

.side-foot { margin-top: auto; font-size: 10.5px; color: var(--muted); line-height: 1.7; border-top: 1px dashed var(--line); padding-top: 10px; }

.main { flex: 1; min-width: 0; padding: 28px 32px 70px; max-width: 1020px; }

.page-head { margin-bottom: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-family: var(--serif); font-size: 23px; font-weight: 700; }
.page-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.page-quote { font-family: var(--serif); font-size: 12.5px; color: var(--amber); border-left: 2px solid var(--honey-soft); padding-left: 10px; max-width: 240px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 17px; box-shadow: var(--shadow); margin-bottom: 15px; }
.card-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; margin-bottom: 4px; }
.card-title .tag { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--paper-2); border-radius: 99px; padding: 1px 8px; margin-left: auto; }
.card-desc { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }

/* 日期条 */
.datebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.datebar .big { font-family: var(--serif); font-size: 21px; font-weight: 700; }
.datebar .wd { font-size: 12.5px; color: var(--muted); }
.icon-btn { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink-2); font-size: 14px; line-height: 1; }
.icon-btn:hover { border-color: #EBCF9A; background: #FFFDF6; }

input.inp, select.inp, textarea.inp {
  font-family: inherit; font-size: 13px; color: var(--ink); background: #fff;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; outline: none; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input.inp:focus, select.inp:focus, textarea.inp:focus { border-color: #E8C271; box-shadow: 0 0 0 3px rgba(232, 194, 113, .22); }
input.inp::placeholder, textarea.inp::placeholder { color: #C8B997; }
textarea.inp { resize: vertical; line-height: 1.6; }

.btn { font-family: inherit; font-size: 13px; cursor: pointer; border-radius: 10px; padding: 8px 16px; border: 1px solid transparent; background: var(--honey); color: #fff; font-weight: 600; transition: all .15s; }
.btn:hover { background: var(--honey-deep); }
.btn.ghost { background: #fff; border-color: var(--line); color: var(--ink-2); font-weight: 500; }
.btn.ghost:hover { border-color: #EBCF9A; background: #FFFDF6; }
.btn.danger { background: #fff; border-color: #EBD3CA; color: #B25A4C; font-weight: 500; }
.btn.sm { padding: 5px 11px; font-size: 12px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* 两个板块 */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.sec-head { padding: 13px 15px 11px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 8px; }
.sec-head .n { font-family: var(--serif); font-size: 15px; font-weight: 700; }
.sec-head .c { font-size: 11.5px; color: var(--muted); margin-left: auto; }
.sec.study .sec-head { background: linear-gradient(135deg, #FFFCF2, #FDF2D8); }
.sec.other .sec-head { background: linear-gradient(135deg, #FFFEF8, #FBF6E7); }
.sec-body { padding: 12px 15px 14px; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; }

.ent { display: flex; align-items: center; gap: 9px; padding: 8px 2px; border-bottom: 1px dashed var(--line-2); }
.ent:last-child { border-bottom: none; }
.ent .txt { flex: 1; min-width: 0; font-size: 13px; word-break: break-word; }
.ent .cat { font-size: 10.5px; color: var(--honey-deep); background: var(--honey-soft); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.ent .del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 4px; border-radius: 6px; }
.ent .del:hover { color: #C0564A; background: var(--honey-soft); }

/* 汇总 */
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
.stat { background: var(--paper); border: 1px solid var(--line-2); border-radius: 13px; padding: 12px 13px; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--honey-deep); }
.stat .v em { font-style: normal; font-size: 11.5px; color: var(--muted); font-weight: 400; }

.grp { border: 1px solid var(--line-2); border-radius: 13px; padding: 11px 13px; margin-top: 9px; background: var(--paper); }
.grp-head { display: flex; align-items: baseline; gap: 9px; }
.grp-head .cat { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.grp-head .cnt { font-size: 11.5px; color: var(--muted); }
.grp-head .bar { flex: 1; height: 5px; background: #F3E9D2; border-radius: 99px; overflow: hidden; max-width: 160px; align-self: center; }
.grp-head .bar i { display: block; height: 100%; background: linear-gradient(90deg, #F3CE79, var(--honey)); }
.grp-body { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); line-height: 1.75; }
.grp-body span { color: var(--ink-2); }
.grp-body span + span::before { content: '；'; color: var(--muted); }

.period { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 10px; }
.period-head { display: flex; align-items: baseline; gap: 10px; cursor: pointer; }
.period-head .l { font-size: 13px; font-weight: 600; }
.period-head .c { font-size: 11px; color: var(--muted); }
.period-head .t { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--honey-deep); font-weight: 600; font-size: 12.5px; }
.period-body { display: none; margin-top: 8px; }
.period.open .period-body { display: block; }

.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { font-family: inherit; font-size: 12.5px; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); cursor: pointer; }
.tab.on { background: var(--honey-soft); border-color: #EBCF9A; color: var(--honey-deep); font-weight: 600; }

.empty { padding: 16px 8px; text-align: center; color: var(--muted); font-size: 12.5px; }
.hint { font-size: 11.5px; color: var(--muted); }

.save-flag {
  position: fixed; right: 18px; bottom: 16px; background: rgba(255,255,255,.94);
  border: 1px solid var(--line); color: var(--muted); font-size: 11.5px;
  border-radius: 99px; padding: 5px 12px; box-shadow: var(--shadow); opacity: 0; transition: opacity .3s; z-index: 40;
}
.save-flag.show { opacity: 1; }

@media (max-width: 880px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; flex: none; height: auto; position: static; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav-item { width: auto; }
  .main { padding: 16px 13px 50px; }
  .two { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .page-quote { display: none; }
  /* 手机：日期条换行排好，输入框别溢出 */
  .datebar { gap: 8px; }
  .datebar .big { font-size: 19px; }
  .datebar input[type="date"] { flex: 1 0 100%; width: 100% !important; order: 9; }
  .add-row { flex-wrap: wrap; }
  .add-row .btn { flex: 0 0 auto; }
  .main { padding: 14px 12px 60px; }
  .card, .sec { border-radius: 15px; }
  .page-title { font-size: 21px; }
  /* 手机上点按更舒服 */
  .btn { padding: 9px 16px; }
  .ent { padding: 10px 2px; }
  .ent .txt { font-size: 14px; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div class="save-flag" id="save-flag"></div>
<input type="file" id="file-in" accept=".json" style="display:none">
<script>
/* daylio.js —— 日期、自动归类、周/月汇总 核心逻辑 */
(function (root) {
  'use strict';

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function toDate(s) {
    if (s instanceof Date) return s;
    if (!s) return new Date();
    var p = String(s).split('-');
    return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
  }
  function dateStr(d) {
    var x = toDate(d);
    return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  }
  function today() { return dateStr(new Date()); }

  var WD = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  function weekday(s) { return WD[toDate(s).getDay()]; }
  function addDays(s, n) {
    var d = toDate(s);
    d.setDate(d.getDate() + n);
    return dateStr(d);
  }
  function weekStart(s) {
    var d = toDate(s);
    var wd = (d.getDay() + 6) % 7;          // 周一 = 0
    d.setDate(d.getDate() - wd);
    return dateStr(d);
  }
  function weekEnd(s) { return addDays(weekStart(s), 6); }
  function weekLabel(s) {
    var a = toDate(weekStart(s)), b = toDate(weekEnd(s));
    return (a.getMonth() + 1) + '月' + a.getDate() + '日 – ' + (b.getMonth() + 1) + '月' + b.getDate() + '日';
  }
  function monthKey(s) {
    var d = toDate(s);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function monthLabel(k) {
    var p = String(k).split('-');
    return p[0] + ' 年 ' + (+p[1]) + ' 月';
  }
  /** 当月第几天 */
  function dayOfMonth(s) { return toDate(s).getDate(); }

  /* ---------------- 自动归类 ---------------- */
  var RULES = [
    { cat: '数学', kws: ['数学', '数分', '高代', '概率', '统计', '线代', '微积分', '建模', '刷题', '习题'] },
    { cat: '编程', kws: ['编程', '代码', 'python', 'c++', 'java', '算法', 'leetcode', '前端', '后端', '建站', '爬虫'] },
    { cat: '英语', kws: ['英语', '单词', '雅思', '托福', '六级', '四级', '听力', '口语', '外刊'] },
    { cat: '专业学习', kws: ['课', '听课', '专业课', '实验', '作业', '复习', '预习', '笔记', '考试', '网课'] },
    { cat: '阅读', kws: ['看书', '读书', '阅读', '文献', 'paper', '小说'] },
    { cat: '科研竞赛', kws: ['科研', '竞赛', '比赛', '论文', '大创', '课题', '组会', '答辩'] },
    { cat: '运动', kws: ['跑步', '健身', '打球', '篮球', '足球', '羽毛球', '游泳', '瑜伽', '跳绳', '散步', '运动'] },
    { cat: '社交', kws: ['朋友', '聚会', '聊', '室友', '社团', '约', '聚餐', '见面'] },
    { cat: '饮食', kws: ['吃饭', '午饭', '晚饭', '早饭', '奶茶', '咖啡', '零食', '食堂', '点外卖'] },
    { cat: '休息娱乐', kws: ['电影', '剧', '游戏', '音乐', '刷视频', '休息', '睡', '追番', 'b站'] },
    { cat: '生活杂事', kws: ['快递', '洗衣', '打扫', '整理', '办事', '排队', '缴费', '买菜', '理发'] },
    { cat: '情绪记录', kws: ['开心', '难过', '焦虑', '累', '心情', '开心', 'emo', '烦躁'] }
  ];
  var UNKNOWN = '未归类';

  // 命中关键词越多越准；并列时按 RULES 顺序（数学等具体科目在前）
  function classify(text) {
    var t = String(text || '').toLowerCase().trim();
    if (!t) return UNKNOWN;
    var best = null, bestScore = 0;
    for (var i = 0; i < RULES.length; i++) {
      var r = RULES[i], hits = [];
      for (var k = 0; k < r.kws.length; k++) {
        var kw = String(r.kws[k]).toLowerCase();
        if (kw && t.indexOf(kw) !== -1 && hits.indexOf(kw) === -1) hits.push(kw);
      }
      if (hits.length > bestScore) { best = r.cat; bestScore = hits.length; }
    }
    return best || UNKNOWN;
  }

  /**
   * 把一批条目按自动分类聚起来
   * entries: [{ text, ... }]
   * 返回 [{ cat, count, texts: [] }]，按条数降序，未归类放最后
   */
  function group(entries) {
    var map = {};
    (entries || []).forEach(function (e) {
      var text = typeof e === 'string' ? e : (e.text || '');
      if (!String(text).trim()) return;
      var c = classify(text);
      if (!map[c]) map[c] = { cat: c, count: 0, texts: [] };
      map[c].count += 1;
      map[c].texts.push(String(text).trim());
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      if (a.cat === UNKNOWN) return 1;
      if (b.cat === UNKNOWN) return -1;
      return b.count - a.count;
    });
  }

  /* ---------------- 汇总 ---------------- */
  function entriesOf(day, kind) {
    if (!day) return [];
    var list = (day[kind] || []);
    return list.filter(function (x) { return x && String(x.text || '').trim(); });
  }

  /** days: { 'YYYY-MM-DD': { study: [], other: [] } } */
  function inRange(days, from, to) {
    var out = { study: [], other: [], dayCount: 0, days: [] };
    Object.keys(days || {}).sort().forEach(function (d) {
      if (d < from || d > to) return;
      var s = entriesOf(days[d], 'study'), o = entriesOf(days[d], 'other');
      if (!s.length && !o.length) return;
      out.days.push(d);
      out.dayCount += 1;
      s.forEach(function (x) { out.study.push(x); });
      o.forEach(function (x) { out.other.push(x); });
    });
    out.studyGroups = group(out.study);
    out.otherGroups = group(out.other);
    out.studyCount = out.study.length;
    out.otherCount = out.other.length;
    return out;
  }

  function weekStat(days, anyDate) {
    var a = weekStart(anyDate), b = weekEnd(anyDate);
    var r = inRange(days, a, b);
    r.key = a; r.label = weekLabel(anyDate); r.from = a; r.to = b;
    return r;
  }
  function monthStat(days, key) {
    var p = String(key).split('-');
    var from = p[0] + '-' + p[1] + '-01';
    var last = new Date(+p[0], +p[1], 0).getDate();
    var to = p[0] + '-' + p[1] + '-' + pad(last);
    var r = inRange(days, from, to);
    r.key = key; r.label = monthLabel(key); r.from = from; r.to = to;
    return r;
  }

  /** 所有有记录的周（新的在前） */
  function allWeeks(days) {
    var set = {};
    Object.keys(days || {}).forEach(function (d) {
      if (!entriesOf(days[d], 'study').length && !entriesOf(days[d], 'other').length) return;
      set[weekStart(d)] = 1;
    });
    return Object.keys(set).sort().reverse();
  }
  function allMonths(days) {
    var set = {};
    Object.keys(days || {}).forEach(function (d) {
      if (!entriesOf(days[d], 'study').length && !entriesOf(days[d], 'other').length) return;
      set[monthKey(d)] = 1;
    });
    return Object.keys(set).sort().reverse();
  }

  /** 连续记录天数（从今天往前数） */
  function streak(days) {
    var n = 0, cur = today();
    while (days && days[cur] &&
      (entriesOf(days[cur], 'study').length || entriesOf(days[cur], 'other').length)) {
      n += 1;
      cur = addDays(cur, -1);
      if (n > 3650) break;
    }
    return n;
  }

  /** 两台设备都写过 → 按 id 取并集；remote 为底，local 的独有条目补进去 */
  function mergeDays(local, remote) {
    var out = {};
    var base = remote || {}, extra = local || {};
    Object.keys(base).forEach(function (d) { out[d] = base[d]; });
    Object.keys(extra).forEach(function (d) {
      if (!out[d]) { out[d] = extra[d]; return; }
      ['study', 'other'].forEach(function (k) {
        var rl = (out[d][k] || []).slice();
        var ids = {};
        rl.forEach(function (x) { ids[x.id] = 1; });
        (extra[d][k] || []).forEach(function (x) {
          if (!ids[x.id]) { rl.push(x); ids[x.id] = 1; }
        });
        out[d][k] = rl;
      });
    });
    return out;
  }

  root.DAYLIO = {
    pad: pad, toDate: toDate, dateStr: dateStr, today: today, weekday: weekday, addDays: addDays,
    weekStart: weekStart, weekEnd: weekEnd, weekLabel: weekLabel,
    monthKey: monthKey, monthLabel: monthLabel, dayOfMonth: dayOfMonth,
    classify: classify, group: group, RULES: RULES, UNKNOWN: UNKNOWN,
    entriesOf: entriesOf, inRange: inRange, weekStat: weekStat, monthStat: monthStat,
    allWeeks: allWeeks, allMonths: allMonths, streak: streak, mergeDays: mergeDays
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* cloud.js —— 云同步（手机任意网络可用）
   数据存在一个只有你们知道的「房间」里，用配对码加密后再上传。
*/
(function (root) {
  'use strict';

  var EP = 'https://api.restful-api.dev/objects';
  var ROOM_KEY = 'daylio-room-v1';

  function b64(buf) {
    var bytes = new Uint8Array(buf), s = '';

  var NTFY = 'https://ntfy.sh';
  var CODE_KEY = 'daylio-sync-code';
  var TS_KEY = 'daylio-sync-ts';

  var hasCrypto = (typeof crypto !== 'undefined' && crypto.subtle && typeof TextEncoder !== 'undefined');

  function b64(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }
  function unb64(str) {

    for (var i = 0; i < s.length; i++) o[i] = s.charCodeAt(i);

  }

  }
  function codeSet(c) {
    try { localStorage.setItem(CODE_KEY, c || ''); } catch (e) { }

        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: enc.encode('daylio-sync'), iterations: 60000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

    var text = JSON.stringify(obj);
    if (!hasCrypto) return Promise.resolve('P' + btoa(unescape(encodeURIComponent(text))));

      var enc = new TextEncoder();

<script>
/* app.js —— Daylio：每天记录（学习 / 其他）+ 周月自动归类汇总 */
(function () {
  'use strict';

  var D = window.DAYLIO;
  var STORE_KEY = 'daylio-v1';
  var SERVER = (typeof location !== 'undefined' && location.protocol === 'http:') ? '' : null;
  var serverInfo = null, serverOK = null, posting = false, pendingPayload = null;
  var state = null;
  var lastSeenRev = '';       // 服务端最后一次更新的时间戳
  var syncing = false;
  var pendingRev = '';
  var tunnel = null;        // { running, starting, url, error }
  var room = null;          // 云同步房间 { id, pass }
  var syncCode = '';        // ntfy 同步码
  var syncBusy = false, syncStatus = '';
  var cloudBusy = false, cloudErr = '', cloudTimer = null, cloudRev = '';

  /* ================= 数据 ================= */
  function defaultState() {
    return {
      version: 1,
      meta: { createdAt: new Date().toISOString(), updatedAt: '' },
      days: {},
      ui: { tab: 'day', date: D.today(), open: {}, sum: 'week' }
    };
  }

  function mergeDefaults(raw) {
    var d = defaultState();
    var s = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
    s.version = 1;
    s.meta = Object.assign({}, d.meta, s.meta || {});
    if (!s.days || typeof s.days !== 'object') s.days = {};
    Object.keys(s.days).forEach(function (k) {
      var day = s.days[k];
      if (!day || typeof day !== 'object') { delete s.days[k]; return; }
      ['study', 'other'].forEach(function (kind) {
        if (!Array.isArray(day[kind])) day[kind] = [];
        day[kind] = day[kind].filter(function (x) { return x && typeof x === 'object'; })
          .map(function (x) { return { id: x.id || uid(), text: String(x.text || '') }; });
      });
    });
    s.ui = Object.assign({}, d.ui, s.ui || {});
    if (!s.ui.open) s.ui.open = {};
    if (!s.ui.date) s.ui.date = D.today();
    return s;
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ================= 存储（立即保存） ================= */
  function serverGet(path) {
    try { var x = new XMLHttpRequest(); x.open('GET', path, false); x.send(null); return x.status === 200 ? x.responseText : null; }
    catch (e) { return null; }
  }
  function cloudLink() {
    if (!room) return '';
    var base = (SERVER !== null) ? 'https://nana-daylio.surge.sh/' : (location.origin + location.pathname);
    return CLOUD.linkFor(room, base);
  }

  function syncDebug(msg) {
    try { if (/[?&]debug=1/.test(location.search)) document.title = 'DIAG ' + msg; } catch (e) { }
  }

  function syncPublish(date) {
    if (!syncCode || !window.SYNC) return;
    var day = state.days[date] || { study: [], other: [] };
    SYNC.publishDay(syncCode, date, day).then(function (ok) {
      syncStatus = ok ? '已同步 ' + hhmm() : '同步失败';
      if (state.ui.tab === 'data' && !document.hidden) render();
    }).catch(function () { syncStatus = '同步失败'; });
  }

  function syncPull(silent) {
    if (!syncCode || !window.SYNC || syncBusy) return;
    syncBusy = true;
    syncDebug('pull start code=' + syncCode);
    SYNC.pull(syncCode, SYNC.lastTs()).then(function (res) {
      syncBusy = false;
      syncDebug('got ' + (res ? res.msgs.length : -1) + ' msgs');
      if (!res || !res.msgs.length) { SYNC.setLastTs(res ? res.lastTs : SYNC.lastTs()); return; }
      var changed = false;
      res.msgs.forEach(function (m) {
        var local = state.days[m.d] || { study: [], other: [] };
        var merged = { study: (m.day.study || []).slice(), other: (m.day.other || []).slice() };

          var ids = {};
          merged[k].forEach(function (x) { ids[x.id] = 1; });
          (local[k] || []).forEach(function (x) { if (!ids[x.id]) merged[k].push(x); });
        });
        var before = JSON.stringify(local);
        if (JSON.stringify(merged) !== before) { state.days[m.d] = merged; changed = true; }
      });
      SYNC.setLastTs(res.lastTs);
      if (changed) {
        saveLocalOnly();
        syncStatus = '收到 ' + res.msgs.length + ' 条更新';
        if (!silent) render();
      }

  }

  function hhmm() {
    var d = new Date();
    return D.pad(d.getHours()) + ':' + D.pad(d.getMinutes());
  }

  function syncPublishAllRecent() {
    if (!syncCode || !window.SYNC) return;
    var keys = Object.keys(state.days).sort().slice(-14);
    keys.forEach(function (k, i) {
      setTimeout(function () { syncPublish(k); }, i * 350);

    if (!room || !window.CLOUD) return;
    if (cloudTimer) clearTimeout(cloudTimer);

      cloudBusy = true;
      var rev = state.meta.updatedAt;
      var payload = JSON.parse(JSON.stringify(state));

  }

  function cloudPull(silent) {

  function fetchTunnel(cb) {
    if (SERVER === null) return;
    try {
      var x = new XMLHttpRequest();
      x.open('GET', '/api/tunnel', true);
      x.onload = function () {
        if (x.status === 200) { try { tunnel = JSON.parse(x.responseText); if (cb) cb(); } catch (e) { } }
      };
      x.send(null);
    } catch (e) { }
  }
  function tunnelAction(action) {
    if (SERVER === null) return;
    flag(action === 'start' ? '正在连接公网…' : '已关闭公网');
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/api/tunnel', true);
      x.setRequestHeader('Content-Type', 'application/json; charset=utf-8');
      x.onload = function () {
        try { tunnel = JSON.parse(x.responseText); } catch (e) { }
        render();
      };
      x.send(JSON.stringify({ action: action }));
    } catch (e) { }
    setTimeout(function () { fetchTunnel(render); }, 1500);
  }

  function serverInfoFetch() {
    try {
      var x = new XMLHttpRequest(); x.open('GET', '/api/info', true);
      x.onload = function () { if (x.status === 200) { try { serverInfo = JSON.parse(x.responseText); render(); } catch (e) { } } };
      x.send(null);
    } catch (e) { }
  }

      if (watch) clearTimeout(watch);
      posting = false; serverOK = ok;
      if (note) flag(note);
      if (pendingPayload != null) flushToServer();
    }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/api/data', true);
      x.setRequestHeader('Content-Type', 'application/json; charset=utf-8');
      x.onload = function () {
        if (x.status === 200) { lastSeenRev = pendingRev || lastSeenRev; }
        finish(x.status === 200, x.status === 200 ? '' : '⚠ 写文件失败');
      };
      x.onerror = function () { finish(false, '⚠ 服务断开，已存浏览器副本'); };

  }

  function mergeStates(local, remote) {
    if (!remote) return local;
    var out = mergeDefaults(JSON.parse(JSON.stringify(remote)));
    out.days = D.mergeDays((local && local.days) || {}, out.days || {});
    return out;
  }

  // 别的地方改了文件 → 合并回来
  function pullRemote() {
    if (SERVER === null || syncing) return;
    syncing = true;
    try {
      var rawRev = serverGet('/api/rev');
      if (!rawRev) { syncing = false; return; }
      var rev = JSON.parse(rawRev);
      if (!rev.updatedAt || rev.updatedAt === lastSeenRev) { syncing = false; return; }
      var rawData = serverGet('/api/data');
      if (!rawData) { syncing = false; return; }
      var remote = tryParse(rawData, 'remote');
      if (!remote) { syncing = false; return; }
      var active = document.activeElement;
      var typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
      state = mergeStates(state, remote);
      lastSeenRev = rev.updatedAt;
      save();
      if (!typing) render();
    } catch (e) { }

  }

  var lastLoadError = '';
  function tryParse(raw, tag) {
    if (!raw) return null;
    try { return mergeDefaults(JSON.parse(raw)); }
    catch (e) { lastLoadError = (tag || '') + ': ' + (e && e.message ? e.message : String(e)); return null; }
  }
  function load() {
    if (SERVER !== null) {
      var s0 = tryParse(serverGet('/api/data'), 'file');
      if (s0) return s0;
    }
    var s1 = tryParse(localStorage.getItem(STORE_KEY), 'main');
    if (s1) return s1;
    return defaultState();
  }
  function saveLocalOnly() {
    state.meta.updatedAt = state.meta.updatedAt || new Date().toISOString();
    var json = JSON.stringify(state);
    try { localStorage.setItem(STORE_KEY, json); } catch (e) { }
    if (SERVER !== null) serverSave(json);
  }

  function save(publishDate) {
    state.meta.updatedAt = new Date().toISOString();
    pendingRev = state.meta.updatedAt;
    var json = JSON.stringify(state);
    try { localStorage.setItem(STORE_KEY, json); } catch (e) { }
    if (SERVER !== null) serverSave(json);
    if (room && window.CLOUD) cloudPush();
    if (publishDate && syncCode) syncPublish(publishDate);

  }

  var flagTimer = null;
  function flag(t) {
    var el = document.getElementById('save-flag');
    if (!el) return;
    el.textContent = t;
    el.classList.add('show');
    if (flagTimer) clearTimeout(flagTimer);
    flagTimer = setTimeout(function () { el.classList.remove('show'); }, 1200);
  }

  /* ================= 侧栏 ================= */
  function dayOf(date) {
    if (!state.days[date]) state.days[date] = { study: [], other: [] };

  }
  function hasContent(day) {
    return !!(day && ((day.study || []).some(function (x) { return String(x.text || '').trim(); }) ||
      (day.other || []).some(function (x) { return String(x.text || '').trim(); })));
  }

  function renderSidebar() {
    var st = D.streak(state.days);
    var mk = D.monthKey(D.today());
    var monthDays = Object.keys(state.days).filter(function (d) {
      return D.monthKey(d) === mk && hasContent(state.days[d]);

    var h = '';
    h += '<div class="brand">' + logo() + '<div><div class="brand-name">Daylio</div>' +
      '<div class="brand-sub">DAILY · NOTES</div></div></div>';
    h += '<div class="streak"><div class="k">连续记录</div>' +
      '<div class="v">' + st + '<small> 天</small></div>' +
      '<div class="s">本月已记 ' + monthDays + ' 天</div></div>';
    h += '<div class="nav">' +
      navBtn('day', '◍', '写今天') +
      navBtn('summary', '▤', '汇总') +
      navBtn('data', '⚙', '数据') +
      '</div>';
    h += '<div class="side-foot">' +
      (SERVER !== null ? '数据自动存到本机文件' : '数据存在浏览器里') +
      '<br>' + (state.meta.updatedAt ? '上次保存 ' + shortTime(state.meta.updatedAt) : '还没有记录') +
      '</div>';
    document.getElementById('sidebar').innerHTML = h;
  }
  function navBtn(id, ico, label) {
    return '<button class="nav-item' + (state.ui.tab === id ? ' active' : '') + '" data-act="tab" data-v="' + id + '">' +
      '<span class="ico">' + ico + '</span><span>' + label + '</span></button>';
  }
  function shortTime(iso) {
    var d = new Date(iso); if (isNaN(d)) return '—';
    var now = new Date();
    var hm = D.pad(d.getHours()) + ':' + D.pad(d.getMinutes());
    return d.toDateString() === now.toDateString() ? hm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
  }
  function logo() {
    return '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="24" cy="24" r="21" fill="#FDF0D2"/>' +
      '<circle cx="24" cy="24" r="15.6" fill="#FFFDF6" stroke="#EBCF9A" stroke-width="1.2"/>' +
      '<path d="M24 13.5c4.2 3.4 6.2 6.6 6.2 9.8A6.2 6.2 0 0 1 24 29.5a6.2 6.2 0 0 1-6.2-6.2c0-3.2 2-6.4 6.2-9.8z" fill="#E2A93B"/>' +
      '<path d="M24 22v12" stroke="#C08823" stroke-width="1.8" stroke-linecap="round"/>' +
      '</svg>';

  /* ================= 视图 ================= */
  function render() {
    renderSidebar();
    var main = document.getElementById('main');
    if (state.ui.tab === 'summary') main.innerHTML = renderSummary();
    else if (state.ui.tab === 'data') main.innerHTML = renderData();
    else main.innerHTML = renderDay();
  }

  function renderDay() {
    var date = state.ui.date || D.today();
    var day = dayOf(date);
    var study = day.study || [], other = day.other || [];
    var h = '';
    h += '<div class="page-head"><div><div class="page-title">写今天</div>' +
      '<div class="page-sub">每天两块：学习 · 其他。写下来，周末就自动归好类了。</div></div>' +
      '<div class="page-quote">今天做完的，别只留在脑子里。</div></div>';

    h += '<div class="datebar">' +
      '<button class="icon-btn" data-act="day-move" data-v="-1">‹</button>' +
      '<div><div class="big">' + fmtDate(date) + '</div>' +
      '<div class="wd">' + D.weekday(date) + '</div></div>' +
      '<button class="icon-btn" data-act="day-move" data-v="1">›</button>' +
      '<input class="inp" type="date" value="' + date + '" data-act="date-pick" style="width:150px">' +
      '<button class="btn ghost sm" data-act="day-today">今天</button>' +
      '</div>';

    h += '<div class="two">' + section('study', '学习', study) + section('other', '其他', other) + '</div>';
    return h;
  }

  function section(kind, name, list) {
    var h = '<div class="sec ' + kind + '"><div class="sec-head">' +
      '<span class="n">' + name + '</span><span class="c">' + list.filter(function (x) { return String(x.text || '').trim(); }).length + ' 条</span></div>' +
      '<div class="sec-body">' +
      '<div class="add-row"><input class="inp" id="in-' + kind + '" placeholder="' +
      (kind === 'study' ? '今天学了什么？如：做数分习题、写 python 作业' : '其他做了什么？如：跑步、取快递、和朋友吃饭') +
      '" data-enter="' + kind + '"><button class="btn sm" data-act="add" data-v="' + kind + '">添加</button></div>';
    var items = list.filter(function (x) { return String(x.text || '').trim(); });
    if (!items.length) {
      h += '<div class="empty">还没有内容。</div>';
    } else {
      items.forEach(function (x, i) {
        h += '<div class="ent"><span class="txt">' + esc(x.text) + '</span>' +
          '<span class="cat">' + esc(D.classify(x.text)) + '</span>' +
          '<button class="del" data-act="del" data-v="' + kind + '" data-i="' + i + '" title="删除">×</button></div>';
      });
    }
    h += '</div></div>';
    return h;
  }

  function fmtDate(d) {
    var x = D.toDate(d);
    return x.getFullYear() + ' 年 ' + (x.getMonth() + 1) + ' 月 ' + x.getDate() + ' 日';
  }

  /* ---------- 汇总 ---------- */
  function renderSummary() {
    var h = '';
    h += '<div class="page-head"><div><div class="page-title">汇总</div>' +
      '<div class="page-sub">按周、按月看，相似的事情自动归到一类</div></div>' +
      '<div class="page-quote">看得见进度，才走得下去。</div></div>';

    h += '<div class="tabs">' +
      '<button class="tab' + (state.ui.sum === 'week' ? ' on' : '') + '" data-act="sum" data-v="week">按周</button>' +
      '<button class="tab' + (state.ui.sum === 'month' ? ' on' : '') + '" data-act="sum" data-v="month">按月</button>' +
      '</div>';

    if (state.ui.sum === 'month') h += monthBlock();
    else h += weekBlock();
    return h;
  }

  function statRow(r) {
    return '<div class="stat-row">' +
      '<div class="stat"><div class="k">记录天数</div><div class="v">' + r.dayCount + '<em> 天</em></div></div>' +
      '<div class="stat"><div class="k">学习</div><div class="v">' + r.studyCount + '<em> 条</em></div></div>' +
      '<div class="stat"><div class="k">其他</div><div class="v">' + r.otherCount + '<em> 条</em></div></div>' +
      '<div class="stat"><div class="k">合计</div><div class="v">' + (r.studyCount + r.otherCount) + '<em> 条</em></div></div>' +
      '</div>';
  }

  function groupList(groups) {
    if (!groups.length) return '<div class="empty">这段时间没有内容。</div>';
    var max = groups.reduce(function (m, g) { return Math.max(m, g.count); }, 1);
    return groups.map(function (g) {
      return '<div class="grp"><div class="grp-head"><span class="cat">' + esc(g.cat) + '</span>' +
        '<span class="cnt">' + g.count + ' 条</span>' +
        '<span class="bar"><i style="width:' + Math.round(g.count / max * 100) + '%"></i></span></div>' +
        '<div class="grp-body">' + g.texts.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div></div>';
    }).join('');
  }

  function weekBlock() {
    var wk = state.ui.weekDate || D.today();
    var r = D.weekStat(state.days, wk);
    var h = '';
    h += '<div class="card"><div class="card-title">本周<span class="tag">' + D.weekLabel(wk) + '</span></div>' +
      statRow(r) + '</div>';
    h += '<div class="two">' +
      '<div class="sec study"><div class="sec-head"><span class="n">学习</span>' +
      '<span class="c">' + r.studyGroups.length + ' 类</span></div><div class="sec-body">' + groupList(r.studyGroups) + '</div></div>' +
      '<div class="sec other"><div class="sec-head"><span class="n">其他</span>' +
      '<span class="c">' + r.otherGroups.length + ' 类</span></div><div class="sec-body">' + groupList(r.otherGroups) + '</div></div>' +
      '</div>';

    var weeks = D.allWeeks(state.days);
    h += '<div class="card" style="margin-top:15px"><div class="card-title">往期周汇总<span class="tag">' + weeks.length + ' 周</span></div>';
    if (!weeks.length) h += '<div class="empty">还没有记录。</div>';
    weeks.forEach(function (k) {
      var rr = D.weekStat(state.days, k);
      var open = !!state.ui.open['w:' + k];
      h += '<div class="period' + (open ? ' open' : '') + '">' +
        '<div class="period-head" data-act="toggle" data-v="w:' + k + '">' +
        '<span class="l">' + D.weekLabel(k) + '</span>' +
        '<span class="c">' + rr.dayCount + ' 天 · ' + (rr.studyCount + rr.otherCount) + ' 条</span>' +
        '<span class="t">学习 ' + rr.studyCount + ' / 其他 ' + rr.otherCount + '</span></div>' +
        '<div class="period-body">' + statRow(rr) +
        '<div class="two" style="margin-top:10px">' +
        '<div class="sec study"><div class="sec-head"><span class="n">学习</span></div><div class="sec-body">' + groupList(rr.studyGroups) + '</div></div>' +
        '<div class="sec other"><div class="sec-head"><span class="n">其他</span></div><div class="sec-body">' + groupList(rr.otherGroups) + '</div></div>' +
        '</div></div></div>';
    });
    h += '</div>';
    return h;
  }

  function monthBlock() {
    var key = state.ui.monthKey || D.monthKey(D.today());
    var r = D.monthStat(state.days, key);
    var h = '';
    h += '<div class="card"><div class="card-title">本月<span class="tag">' + D.monthLabel(key) + '</span></div>' +
      statRow(r) + '</div>';
    h += '<div class="two">' +
      '<div class="sec study"><div class="sec-head"><span class="n">学习</span>' +
      '<span class="c">' + r.studyGroups.length + ' 类</span></div><div class="sec-body">' + groupList(r.studyGroups) + '</div></div>' +
      '<div class="sec other"><div class="sec-head"><span class="n">其他</span>' +
      '<span class="c">' + r.otherGroups.length + ' 类</span></div><div class="sec-body">' + groupList(r.otherGroups) + '</div></div>' +
      '</div>';

    var months = D.allMonths(state.days);
    h += '<div class="card" style="margin-top:15px"><div class="card-title">往期月汇总<span class="tag">' + months.length + ' 月</span></div>';
    if (!months.length) h += '<div class="empty">还没有记录。</div>';
    months.forEach(function (k) {
      var rr = D.monthStat(state.days, k);

      h += '<div class="period' + (open ? ' open' : '') + '">' +
        '<div class="period-head" data-act="toggle" data-v="m:' + k + '">' +
        '<span class="l">' + D.monthLabel(k) + '</span>' +
        '<span class="c">' + rr.dayCount + ' 天 · ' + (rr.studyCount + rr.otherCount) + ' 条</span>' +
        '<span class="t">学习 ' + rr.studyCount + ' / 其他 ' + rr.otherCount + '</span></div>' +
        '<div class="period-body">' + statRow(rr) +
        '<div class="two" style="margin-top:10px">' +
        '<div class="sec study"><div class="sec-head"><span class="n">学习</span></div><div class="sec-body">' + groupList(rr.studyGroups) + '</div></div>' +
        '<div class="sec other"><div class="sec-head"><span class="n">其他</span></div><div class="sec-body">' + groupList(rr.otherGroups) + '</div></div>' +
        '</div></div></div>';
    });
    h += '</div>';
    return h;
  }

  var tinfo = {};
  function renderData() {
    var info = '';
    if (SERVER !== null) {
      info = '<table style="width:100%;font-size:13px"><tbody>' +
        '<tr><td style="width:34%;color:var(--muted)">保存方式</td><td>硬盘文件（自动，改完立刻写）' +
        (serverOK === false ? '<span style="color:#B25A4C">　最近一次写入失败</span>' : '') + '</td></tr>' +
        '<tr><td style="color:var(--muted)">数据文件</td><td style="word-break:break-all">' +
        esc(serverInfo && serverInfo.file ? serverInfo.file : '…\\NaNaDaylio\\data\\日记数据.json') + '</td></tr>' +
        '<tr><td style="color:var(--muted)">最近保存</td><td>' +
        (state.meta.updatedAt ? new Date(state.meta.updatedAt).toLocaleString('zh-CN', { hour12: false }) : '—') + '</td></tr>' +
        '</tbody></table>';
    } else {
      info = '<div class="hint">数据存在浏览器里，每次修改立即保存。想直接存成文件，请用桌面图标启动。</div>';

    var lan = (serverInfo && serverInfo.lan) || [];
    // 同步卡（ntfy：手机电脑不见面也能同步）
    var syncCard = '<div class="card"><div class="card-title">手机 ↔ 电脑同步<span class="tag">不用电脑开机也行</span></div>' +
      '<div class="card-desc">给手机和电脑配同一个同步码，两边改完各自立刻保存，联网就自动对齐。</div>' +
      (syncCode
        ? ('<div class="ent" style="padding:10px 2px"><span class="txt" style="font-size:16px;font-weight:700;letter-spacing:.12em">' +
           esc(syncCode) + '</span><button class="btn ghost sm" data-act="sync" data-v="copy">复制</button></div>' +
           '<div class="btn-group" style="margin-top:8px">' +
           '<button class="btn ghost sm" data-act="sync" data-v="now">立即同步</button>' +
           '<button class="btn ghost sm" data-act="sync" data-v="push">重发本机全部</button>' +
           '<button class="btn danger sm" data-act="sync" data-v="off">断开同步</button></div>' +
           '<div class="hint" style="margin-top:8px">' + (syncStatus || '已开启，每 9 秒自动检查一次') + '</div>')
        : ('<div class="btn-group"><button class="btn" data-act="sync" data-v="new">生成同步码</button></div>' +
           '<div class="ent" style="margin-top:10px;padding:0"><input class="inp" id="sync-in" placeholder="或粘贴另一台设备的同步码"><button class="btn ghost sm" data-act="sync" data-v="join">使用</button></div>' +
           '<div class="hint" style="margin-top:8px">两台设备用同一个码就配对好了；数据加密后才发出，密码就是这串码。</div>')) +
      '</div>';

    // 公网卡（bore 隧道：任何网络都能访问）
    var hasBore = !!(serverInfo && serverInfo.hasBore);
    var ti = (serverInfo && serverInfo.tunnel) || tunnel || {};
    var pubUrl = ti.url || '';
    var cloudCard = '<div class="card"><div class="card-title">手机随时随地<span class="tag">任何网络</span></div>' +
      '<div class="card-desc">开启后得到一个公网地址，用手机流量、连任何 Wi-Fi 都能打开记。电脑关机就访问不了。</div>' +
      (function () {
        if (SERVER === null) return '<div class="hint">这个功能要在电脑上的 Daylio 里用（手机端不需要设置）。</div>';
        if (!hasBore) return '<div class="hint">缺少 bore.exe，公网功能不可用。</div>';
        if (ti.starting) return '<div class="ent" style="padding:10px 2px"><span class="txt">正在连接公网…（约 5–15 秒）</span></div>';
        if (ti.running && pubUrl) {
          return '<div class="ent" style="padding:10px 2px"><span class="txt" style="font-size:13.5px;font-weight:600;word-break:break-all">' +
            esc(pubUrl) + '</span><button class="btn ghost sm" data-act="copy" data-v="' + esc(pubUrl) + '">复制</button></div>' +
            '<div class="btn-group" style="margin-top:8px">' +
            '<button class="btn ghost sm" data-act="tunnel" data-v="stop">关闭公网</button></div>' +
            '<div class="hint" style="margin-top:8px">这个地址带着访问码，只发给自己。每次开启端口会变。</div>';
        }
        return '<div class="btn-group"><button class="btn" data-act="tunnel" data-v="start">开启公网访问</button></div>' +
          '<div class="hint" style="margin-top:8px">' + (ti.error ? '上次失败：' + esc(ti.error) + '。' : '') +
          '电脑要联网、保持开机。</div>';
      })() +
      '</div>';

    var phoneCard = '';
    if (SERVER !== null) {
      phoneCard = '<div class="card"><div class="card-title">手机也能记<span class="tag">同一 Wi-Fi · 更快</span></div>' +
        '<div class="card-desc">不上云的话，手机连同一个 Wi-Fi 打开这个地址也能记，两边自动合并。</div>' +
        (lan.length
          ? lan.map(function (u) {
              return '<div class="ent" style="padding:10px 2px"><span class="txt" style="font-size:14px;font-weight:600">' +
                esc(u) + '</span><button class="btn ghost sm" data-act="copy" data-v="' + esc(u) + '">复制</button></div>';
            }).join('')
          : '<div class="hint">没识别到局域网地址，请确认电脑连着 Wi-Fi。</div>') +
        '<div class="hint" style="margin-top:10px">' +

        '③ 校园网可能开了设备隔离，改连手机热点再试。</div></div>';

      syncCard + cloudCard + phoneCard +

      '<div class="card"><div class="card-title">备份与恢复</div>' +
      '<div class="card-desc">导出一个 .json，换电脑时可以带过去。</div>' +
      '<div class="btn-group"><button class="btn" data-act="export">导出备份</button>' +
      '<button class="btn ghost" data-act="import">导入备份</button>' +
      '<button class="btn danger" data-act="clear">清空全部记录</button></div></div>';
  }

  /* ================= 事件 ================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');

    if (act === 'tab') { state.ui.tab = v; save(); render(); return; }
    if (act === 'sum') { state.ui.sum = v; save(); render(); return; }
    if (act === 'toggle') { state.ui.open[v] = !state.ui.open[v]; save(); render(); return; }
    if (act === 'day-move') { state.ui.date = D.addDays(state.ui.date || D.today(), +v); save(); render(); return; }
    if (act === 'day-today') { state.ui.date = D.today(); save(); render(); return; }
    if (act === 'add') { addEntry(v); return; }
    if (act === 'del') {
      var kind = v, i = +el.getAttribute('data-i');
      var list = dayOf(state.ui.date)[kind] || [];
      var real = list.filter(function (x) { return String(x.text || '').trim(); });
      var target = real[i];
      if (!target) return;
      dayOf(state.ui.date)[kind] = list.filter(function (x) { return x !== target; });
      save(state.ui.date); render(); return;
    }
    if (act === 'sync') {
      if (v === 'new') {
        syncCode = SYNC.newCode();
        SYNC.codeSet(syncCode);
        flag('同步码已生成');
        render();
        syncPublishAllRecent();
      } else if (v === 'join') {
        var el = document.getElementById('sync-in');
        var c = (el && el.value || '').trim().toLowerCase();
        if (!c) { flag('先填同步码'); return; }
        if (!/^[a-z0-9]{4,20}$/.test(c)) { flag('同步码格式不对'); return; }
        syncCode = c; SYNC.codeSet(c); SYNC.setLastTs(0);
        flag('已配对');
        render();
        syncPull(true);
        syncPublishAllRecent();
      } else if (v === 'off') {
        if (!confirm('断开同步？两台设备以后不再自动对齐。')) return;
        syncCode = ''; SYNC.codeSet(''); SYNC.setLastTs(0); render();
      } else if (v === 'now') {
        syncPull(false); flag('正在同步…'); setTimeout(render, 1200);
      } else if (v === 'push') {
        syncPublishAllRecent(); flag('正在重发…');
      } else if (v === 'copy') {
        try { navigator.clipboard.writeText(syncCode); flag('已复制同步码'); } catch (e) { }
      }
      return;
    }
    if (act === 'cloud') {
      if (v === 'on') {
        flag('正在创建云房间…');
        CLOUD.createRoom().then(function (rm) {
          room = rm; CLOUD.saveRoom(rm);
          cloudRev = '';
          cloudPush(true);
          render();
          flag('已开启云同步');
        }).catch(function (e) { cloudErr = '创建失败：' + e.message; render(); });
      } else if (v === 'off') {
        if (!confirm('断开云同步？手机上的链接会失效，数据仍留在本机。')) return;
        room = null; CLOUD.clearRoom(); cloudRev = ''; save(); render();
      } else if (v === 'sync') {
        cloudPush(true); cloudPull(false); flag('已同步'); setTimeout(render, 800);
      }
      return;
    }
    if (act === 'tunnel') { tunnelAction(v); return; }
    if (act === 'copy') {
      var txt = v || '';
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt); flag('已复制地址');
        } else {
          var ta = document.createElement('textarea');
          ta.value = txt; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove(); flag('已复制地址');
        }
      } catch (e) { flag('复制失败，手动选一下吧'); }
      return;
    }
    if (act === 'export') { doExport(); return; }
    if (act === 'import') { document.getElementById('file-in').click(); return; }
    if (act === 'clear') {
      if (!confirm('清空全部日记？建议先导出备份。')) return;
      state.days = {}; save(); render(); return;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-act') === 'date-pick') {
      state.ui.date = e.target.value || D.today();
      save(); render(); return;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var k = e.target.getAttribute && e.target.getAttribute('data-enter');
    if (k) { e.preventDefault(); addEntry(k); }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id !== 'file-in') return;
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        state = mergeDefaults(JSON.parse(reader.result));
        save(); render(); flag('已导入');
      } catch (err) { alert('这个文件读不出来：' + err.message); }
    };
    reader.readAsText(f);
    e.target.value = '';
  });

  function addEntry(kind) {
    var inp = document.getElementById('in-' + kind);
    if (!inp) return;
    var text = (inp.value || '').trim();
    if (!text) { flag('先写点什么'); inp.focus(); return; }
    var day = dayOf(state.ui.date || D.today());
    if (!Array.isArray(day[kind])) day[kind] = [];
    day[kind].push({ id: uid(), text: text });
    save(state.ui.date); render();
    var again = document.getElementById('in-' + kind);
    if (again) again.focus();
  }

  function doExport() {
    var blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Daylio-' + D.today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    flag('已导出');
  }

  /* ================= 启动 ================= */
  // 支持用 ?code=xxxx 一次性配对（手机上直接点链接即可）
  var urlCode = '';
  try {
    var mm = (location.search + location.hash).match(/[?&#]code=([a-z0-9]{4,20})/i);
    if (mm) urlCode = mm[1].toLowerCase();
  } catch (e) { }
  syncCode = urlCode || (window.SYNC && SYNC.codeGet()) || '';
  if (urlCode && window.SYNC) { SYNC.codeSet(urlCode); SYNC.setLastTs(0); }
  room = (window.CLOUD && CLOUD.roomFromHash()) || (window.CLOUD && CLOUD.loadRoom()) || null;
  if (room && window.CLOUD) CLOUD.saveRoom(room);
  state = load();
  if (room && window.CLOUD) cloudPull(false);
  if (syncCode && window.SYNC) {
    syncPull(false);
    setInterval(function () { if (!document.hidden) syncPull(true); }, 9000);
    window.addEventListener('focus', function () { syncPull(true); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) syncPull(true); });
  }
  if (SERVER !== null) {
    try { var r0 = serverGet('/api/rev'); if (r0) lastSeenRev = (JSON.parse(r0).updatedAt || ''); } catch (e) { }
  }
  render();
  if (SERVER !== null) {
    serverInfoFetch();
    setInterval(function () { if (!document.hidden) pullRemote(); }, 6000);   // 页面在前台才查
    setInterval(function () { if (!document.hidden && state.ui.tab === 'data') fetchTunnel(render); }, 8000);
    window.addEventListener('focus', pullRemote);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) pullRemote(); });
  }
  if (!state.meta.updatedAt && !lastLoadError) save();
  window.addEventListener('beforeunload', function () { if (SERVER !== null) save(); });
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  });
}
</script>
